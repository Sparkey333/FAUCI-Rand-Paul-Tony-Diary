name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  core:
    name: Core and CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      # The exit codes are a documented interface, so they are worth asserting
      # rather than trusting.
      - name: Verify the tamper-detection exit codes
        run: |
          set -euo pipefail
          cargo build --release
          BIN=./target/release/provenance
          W=$(mktemp -d)
          printf 'page one\n' > "$W/a.txt"

          "$BIN" seal "$W" --note "ci smoke test"
          "$BIN" verify "$W"
          echo "clean verify exited 0, as expected"

          printf 'page one, altered\n' > "$W/a.txt"
          if "$BIN" verify "$W"; then
            echo "::error::verify exited 0 on tampered content"
            exit 1
          fi
          echo "tampered verify exited non-zero, as expected"

      # No claim may carry a status its citations do not support.
      - name: Check the claim ledger
        run: ./target/release/provenance ledger check --file ledger/claims.jsonl

  desktop:
    name: Desktop app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      # Tauri links against the system webview; without these the crate will not
      # even compile on Linux.
      - name: Install Linux webview dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf

      - name: Clippy
        working-directory: desktop/src-tauri
        run: cargo clippy --all-targets

      - name: Test the command surface
        working-directory: desktop/src-tauri
        run: cargo test
