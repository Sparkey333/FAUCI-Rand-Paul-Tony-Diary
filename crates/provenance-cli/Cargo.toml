[package]
name = "provenance-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Command line front-end for provenance-core."

[[bin]]
name = "provenance"
path = "src/main.rs"

[dependencies]
provenance-core.workspace = true
serde_json.workspace = true
time.workspace = true
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
