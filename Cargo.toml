[workspace]
resolver = "2"
members = ["crates/provenance-core", "crates/provenance-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Sparkey333/FAUCI-Rand-Paul-Tony-Diary"

[workspace.dependencies]
provenance-core = { path = "crates/provenance-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
time = { version = "0.3", features = ["formatting", "parsing", "serde-well-known"] }
thiserror = "2"
walkdir = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
